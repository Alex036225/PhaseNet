      SCALE_NAME: large
      FEATURE_DIM: 192
      LATENT_DIM: 48
      HIDDEN_DIM: 192
      TCN_LAYERS: 6
      ENCODER_CHANNELS: [24, 48, 96, 192]
      ENCODER_EXPAND_RATIO: 4
      TEMPORAL_MODULE: phase_aware
      PHASE_FS: 30.0
      PHASE_LOW_BPM: 45.0
      PHASE_HIGH_BPM: 150.0
      PHASE_NUM_FREQ_BINS: 128
      PHASE_DROPOUT: 0.1

INFERENCE:
  BATCH_SIZE: 1
  EVALUATION_WINDOW:
    WINDOW_SIZE: 20
