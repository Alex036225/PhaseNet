BASE: ['PhaseNet_UBFC_UBFC_072_100_train_test.yaml']

TRAIN:
  BATCH_SIZE: 1
  MODEL_FILE_NAME: PhysLLM_PhaseNet_Large_PhaseAware_UBFC_256
  DATA:
    DO_PREPROCESS: true
    EXP_DATA_NAME: ""
    FILE_LIST_PATH: "/public_hw/share/cit_ztyu/zhaobo/rPPG_dataset_processed/UBFC/DataFileLists"
    PREPROCESS:
      CHUNK_LENGTH: 256

TEST:
  DATA:
    DO_PREPROCESS: true
    EXP_DATA_NAME: ""
    FILE_LIST_PATH: "/public_hw/share/cit_ztyu/zhaobo/rPPG_dataset_processed/UBFC/DataFileLists"
    PREPROCESS:
      CHUNK_LENGTH: 256

LOG:
  PATH: ./logs/PhaseNet/PhysLLM_PhaseNet_Large_PhaseAware_UBFC_256

MODEL:
  MODEL_DIR: PreTrainedModels/physllm_phasenet_large_phaseaware_ubfc_256
  PHASENET:
